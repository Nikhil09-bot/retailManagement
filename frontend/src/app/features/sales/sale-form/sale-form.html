<div class="page-header">
  <h1>New Sale</h1>
</div>

<form class="card" [formGroup]="form" (ngSubmit)="submit()">
  @if (errorMessage()) {
    <p class="error-text">{{ errorMessage() }}</p>
  }

  <table class="data-table" formArrayName="items">
    <thead>
      <tr>
        <th>Product</th>
        <th>Quantity</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (item of itemsArray.controls; track $index; let i = $index) {
        <tr [formGroupName]="i">
          <td>
            <select formControlName="productId">
              <option [ngValue]="null">Select a product...</option>
              @for (product of products(); track product.id) {
                <option [ngValue]="product.id">
                  {{ product.name }} ({{ product.productCode }}) - {{ product.sellingPrice }}
                </option>
              }
            </select>
          </td>
          <td>
            <input type="number" min="1" formControlName="quantity" />
          </td>
          <td>
            <button type="button" class="btn btn-secondary" (click)="removeItem(i)" [disabled]="itemsArray.length === 1">
              Remove
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>

  <button type="button" class="btn btn-secondary" style="margin-top: 0.75rem" (click)="addItem()">
    + Add Item
  </button>

  <div class="form-grid" style="margin-top: 1.5rem">
    <div class="form-field">
      <label for="taxRate">Tax Rate (%)</label>
      <input id="taxRate" type="number" step="0.01" formControlName="taxRate" />
    </div>

    <div class="form-field">
      <label for="discountAmount">Discount Amount</label>
      <input id="discountAmount" type="number" step="0.01" formControlName="discountAmount" />
    </div>

    <div class="form-field">
      <label for="paymentMethod">Payment Method</label>
      <select id="paymentMethod" formControlName="paymentMethod">
        <option value="CASH">Cash</option>
        <option value="CARD">Card</option>
        <option value="MOBILE_PAYMENT">Mobile Payment</option>
        <option value="BANK_TRANSFER">Bank Transfer</option>
      </select>
    </div>
  </div>

  <div class="form-field" style="margin-top: 1rem">
    <label for="notes">Notes</label>
    <textarea id="notes" rows="2" formControlName="notes"></textarea>
  </div>

  <p style="margin-top: 1rem"><strong>Estimated subtotal:</strong> {{ estimatedSubtotal() | number: '1.2-2' }}</p>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Saving...' : 'Complete Sale' }}
    </button>
    <a routerLink="/sales" class="btn btn-secondary">Cancel</a>
  </div>
</form>
