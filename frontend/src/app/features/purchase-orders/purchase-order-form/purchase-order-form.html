<div class="page-header">
  <h1>New Purchase Order</h1>
</div>

<form class="card" [formGroup]="form" (ngSubmit)="submit()">
  @if (errorMessage()) {
    <p class="error-text">{{ errorMessage() }}</p>
  }

  <div class="form-grid">
    <div class="form-field">
      <label for="supplierId">Supplier</label>
      <select id="supplierId" formControlName="supplierId">
        <option [ngValue]="null">Select a supplier...</option>
        @for (supplier of suppliers(); track supplier.id) {
          <option [ngValue]="supplier.id">{{ supplier.name }} ({{ supplier.supplierCode }})</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="expectedDeliveryDate">Expected Delivery Date</label>
      <input id="expectedDeliveryDate" type="date" formControlName="expectedDeliveryDate" />
    </div>
  </div>

  <table class="data-table" formArrayName="items" style="margin-top: 1.25rem">
    <thead>
      <tr>
        <th>Product</th>
        <th>Quantity Ordered</th>
        <th>Unit Price</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (item of itemsArray.controls; track $index; let i = $index) {
        <tr [formGroupName]="i">
          <td>
            <select formControlName="productId">
              <option [ngValue]="null">Select a product...</option>
              @for (product of products(); track product.id) {
                <option [ngValue]="product.id">{{ product.name }} ({{ product.productCode }})</option>
              }
            </select>
          </td>
          <td>
            <input type="number" min="1" formControlName="quantityOrdered" />
          </td>
          <td>
            <input type="number" min="0" step="0.01" formControlName="unitPrice" />
          </td>
          <td>
            <button
              type="button"
              class="btn btn-secondary"
              (click)="removeItem(i)"
              [disabled]="itemsArray.length === 1"
            >
              Remove
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>

  <button type="button" class="btn btn-secondary" style="margin-top: 0.75rem" (click)="addItem()">
    + Add Item
  </button>

  <div class="form-field" style="margin-top: 1.25rem">
    <label for="notes">Notes</label>
    <textarea id="notes" rows="2" formControlName="notes"></textarea>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Saving...' : 'Create Purchase Order' }}
    </button>
    <a routerLink="/purchase-orders" class="btn btn-secondary">Cancel</a>
  </div>
</form>
