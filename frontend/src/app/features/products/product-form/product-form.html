<div class="page-header">
  <h1>{{ isEditMode ? 'Edit Product' : 'New Product' }}</h1>
</div>

<form class="card" [formGroup]="form" (ngSubmit)="submit()">
  @if (errorMessage()) {
    <p class="error-text">{{ errorMessage() }}</p>
  }

  <div class="form-grid">
    <div class="form-field">
      <label for="productCode">Product Code</label>
      <input id="productCode" type="text" formControlName="productCode" />
    </div>

    <div class="form-field">
      <label for="barcode">Barcode</label>
      <input id="barcode" type="text" formControlName="barcode" />
    </div>

    <div class="form-field">
      <label for="name">Name</label>
      <input id="name" type="text" formControlName="name" />
    </div>

    <div class="form-field">
      <label for="brand">Brand</label>
      <input id="brand" type="text" formControlName="brand" />
    </div>

    <div class="form-field">
      <label for="category">Category</label>
      <input id="category" type="text" formControlName="category" />
    </div>

    <div class="form-field">
      <label for="unit">Unit</label>
      <input id="unit" type="text" formControlName="unit" placeholder="pcs, kg, box..." />
    </div>

    <div class="form-field">
      <label for="purchasePrice">Purchase Price</label>
      <input id="purchasePrice" type="number" step="0.01" formControlName="purchasePrice" />
    </div>

    <div class="form-field">
      <label for="sellingPrice">Selling Price</label>
      <input id="sellingPrice" type="number" step="0.01" formControlName="sellingPrice" />
    </div>

    <div class="form-field">
      <label for="quantityInStock">Quantity In Stock</label>
      <input id="quantityInStock" type="number" formControlName="quantityInStock" />
    </div>

    <div class="form-field">
      <label for="reorderLevel">Reorder Level</label>
      <input id="reorderLevel" type="number" formControlName="reorderLevel" />
    </div>
  </div>

  <div class="form-field" style="margin-top: 1rem">
    <label for="description">Description</label>
    <textarea id="description" rows="3" formControlName="description"></textarea>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Saving...' : 'Save' }}
    </button>
    <a routerLink="/products" class="btn btn-secondary">Cancel</a>
  </div>
</form>
